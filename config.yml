# 章鱼 AI · 抓取智能体配置
# 敏感信息（PUSHPLUS_TOKEN）请用环境变量或 GitHub Secrets 提供，不要写在这里。

# 时间窗口：只推送发布时间落在最近 N 分钟内的条目
window_minutes: 180

# 循环模式下的抓取间隔
interval_minutes: 30

# 夜间免打扰（北京时间）：quiet_start 之后到次日 quiet_end 之前暂停抓取与推送。
# 23:00 睡、07:00 起。任一端留空、或两端相同即关闭免打扰。
# --dry-run 本地预览与手动推送（--manual / --manual-web）不受影响。
quiet_start: "23:00"
quiet_end: "07:00"

# 每个源单轮最多推几条。0 = 不限：通过时间校验的条目全量进入推送。
# 想防刷屏时改回正整数（如 8）即可。
max_items_per_source: 0

# 单条推送的总条数上限。0 = 不限：一条推送包含全部抓取内容。
max_items_total: 0

# 本轮无新增时是否仍推送一条"无新增"播报
push_when_empty: true

# 去重状态文件（相对项目根目录）
state_file: state/seen.json

# 网络参数
timeout: 15
retries: 2

# 需要临时关掉的源，填源名即可，如：[datayes, hibor]
disabled_sources: []

# 各源的细粒度参数。
# 注意：这里不再给单源设 limit（默认跟随 max_items_per_source: 0，即全量）。
# 如需给某个源单独限量，加一行 limit: N 即可；limit: 0 表示该源不限。
# 下面的 *_top 是"榜单取前几名"的抓取口径，不是推送截断，保留原值。
sources:
  iwencai:
    hot_top: 8          # 人气榜取前几名
  eastmoney:
    page_size: 30
  ifind:
    board_top: 6        # 板块热力取前几个行业
    slot_minutes: 30    # 快照时间对齐粒度
  jisilu:
    move_threshold: 5.0 # 转债涨跌幅异动阈值(%)
    mover_top: 6
    dblow_top: 5        # 双低榜取前几只

# PushPlus 群组推送（一对多）支持多个 topic，逗号分隔或列表
pushplus_topics: oai.1
# pushplus_topics: ["oai.1", "another-group"]
# 留空则只推送给自己（单人模式）

# DeepSeek 大模型提炼配置（选填，用于一对一手动主题分析推送）
deepseek_api_key: ""
deepseek_model: "deepseek-v4-flash"

# --- 主题因子分析（一对一）：python main.py --theme "人形机器人" -------------
# 只输入主题，自动完成 A股市场监督管理视角 + qlib Alpha158 因子模型分析。

# 取板块内成交额前几只个股做因子计算。调大耗时与 token 都会上升。
factor_stock_top: 6

# 取多少根日线计算因子。60 日窗口的因子至少要 70 根，250 根约一年。
factor_kline_limit: 250

# 监管动态回溯天数（问询函/立案/异常波动等）
supervision_days: 30

# 主题因子分析的行情数据源：
#   auto（默认）—— 东财优先，任一环节连不上自动降级 Yahoo Finance
#   eastmoney    —— 只用东方财富接口（国内机器，板块/资金流最全）
#   yahoo        —— 只用 Yahoo Finance（国外机器可直连，免费、免注册、无 Key）
factor_market_source: auto

# GitHub Token（选填）：拉取 microsoft/qlib 因子定义时用。
# qlib 是公共仓库，不填也能读（未认证 60 次/小时），填了只是提高限额。
github_token: ""
