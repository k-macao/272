# 章鱼 AI · 抓取智能体配置
# 敏感信息（PUSHPLUS_TOKEN）请用环境变量或 GitHub Secrets 提供，不要写在这里。

# 时间窗口：只推送发布时间落在最近 N 分钟内的条目
window_minutes: 180

# 循环模式下的抓取间隔
interval_minutes: 30

# 每个源单轮最多推几条。0 = 不限：通过时间校验的条目全量进入推送。
# 想防刷屏时改回正整数（如 8）即可。
max_items_per_source: 0

# 单条推送的总条数上限。0 = 不限：一条推送包含全部抓取内容。
max_items_total: 0

# 本轮无新增时是否仍推送一条"无新增"播报
push_when_empty: true

# 去重状态文件（相对项目根目录）
state_file: state/seen.json

# 网络参数
timeout: 15
retries: 2

# 需要临时关掉的源，填源名即可，如：[datayes, hibor]
disabled_sources: []

# 各源的细粒度参数。
# 注意：这里不再给单源设 limit（默认跟随 max_items_per_source: 0，即全量）。
# 如需给某个源单独限量，加一行 limit: N 即可；limit: 0 表示该源不限。
# 下面的 *_top 是"榜单取前几名"的抓取口径，不是推送截断，保留原值。
sources:
  iwencai:
    hot_top: 8          # 人气榜取前几名
  eastmoney:
    page_size: 30
  ifind:
    board_top: 6        # 板块热力取前几个行业
    slot_minutes: 30    # 快照时间对齐粒度
  jisilu:
    move_threshold: 5.0 # 转债涨跌幅异动阈值(%)
    mover_top: 6
    dblow_top: 5        # 双低榜取前几只

# PushPlus 群组推送（一对多）支持多个 topic，逗号分隔或列表
pushplus_topics: oai.1
# pushplus_topics: ["oai.1", "another-group"]
# 留空则只推送给自己（单人模式）

# DeepSeek 大模型提炼配置（选填，用于一对一手动主题分析推送）
deepseek_api_key: "sk-55b349942fe04e2db1ed81bc9f285cc0"
deepseek_model: "deepseek-v4-flash"
