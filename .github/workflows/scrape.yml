name: 章鱼AI 抓取推送

on:
  schedule:
    # 每 30 分钟一次。GitHub Actions 用 UTC，这里覆盖全天；
    # 抓取程序内部按 A 股交易时段自行判断哪些源该产出内容。
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      window_minutes:
        description: "时间窗口（分钟）"
        required: false
        default: "180"
      dry_run:
        description: "只抓不推（true/false）"
        required: false
        default: "false"

# 同一时间只允许一个实例，避免上一轮没跑完就叠加
concurrency:
  group: octopus-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 恢复去重状态
        uses: actions/cache/restore@v5
        with:
          path: state
          key: octopus-state-${{ github.run_id }}
          restore-keys: |
            octopus-state-

      - name: 执行抓取与推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          DATAYES_TOKEN: ${{ secrets.DATAYES_TOKEN }}
          OCTOPUS_WINDOW_MINUTES: ${{ github.event.inputs.window_minutes || '180' }}
          TZ: Asia/Shanghai
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: 保存去重状态
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state
          key: octopus-state-${{ github.run_id }}

      - name: 上传预览（仅 dry-run）
        if: always() && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: preview
          path: preview.html
          if-no-files-found: ignore
          retention-days: 3
